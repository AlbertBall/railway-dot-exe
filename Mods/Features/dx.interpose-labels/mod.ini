[mod]
id = dx.interpose-labels
name = Interpose Labels
description = Adds editable interpose-style labels to individual track elements.
version = 1.0.0
api = 1
enabled_by_default = false

[action.interpose_label]
event = track_context
caption = Interpose Label...
edit_caption = Edit Interpose Label...
remove_caption = Remove Interpose Label
command = text_overlay
max_length = 4
default_colour = silver
